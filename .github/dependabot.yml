version: 2
updates:
  # Actions usadas nos workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Imagem base do Dockerfile da aplicação
  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"

  # Providers do Terraform
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"

  # Features e imagem do dev container
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
